  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indo-European Luxury Villa | Immersive Virtual Tour</title>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #0f1424;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // --- HOUSE DIMENSIONS ---
    const houseW = 16;
    const houseD = 12;
    const hW = houseW / 2;
    const hD = houseD / 2;
    const wallThick = 0.22;
    const wallH = 3.4; 

    // --- ENGINE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbae6fd); // Daylight sky color to prevent black screen drops
    scene.fog = new THREE.FogExp2(0xbae6fd, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(24, 14, 24);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.0, 0);
    controls.maxPolarAngle = Math.PI * 0.47;

    // --- LIGHTING INFRASTRUCTURE ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.8);
    sunLight.position.set(20, 25, 15);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // --- PREMIUM MATERIAL PALETTE ---
    const mat = {
      stuccoWall: new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.5 }), 
      terracottaTile: new THREE.MeshStandardMaterial({ color: 0xc2410c, roughness: 0.6 }), 
      teakWood: new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.4 }), 
      euroMarble: new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.15 }), 
      brass: new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.8 }), 
      lawn: new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.9 }),
      driveway: new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.8 })
    };

    // --- STRUCTURAL BUILDERS ---
    const createWall = (w, d, h, x, z, material = mat.stuccoWall) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      b.position.set(x, h/2 + 0.3, z);
      b.castShadow = true;
      b.receiveShadow = true;
      scene.add(b);
    };

    const createPitchedRoof = (w, d, h, x, y, z) => {
      const geom = new THREE.ConeGeometry(w * 0.7, h, 4);
      geom.rotateY(Math.PI * 0.25);
      geom.scale(1, 1, d / w);
      const roofMesh = new THREE.Mesh(geom, mat.terracottaTile);
      roofMesh.position.set(x, y + h/2, z);
      roofMesh.castShadow = true;
      scene.add(roofMesh);
    };

    const createTeakPillar = (x, z) => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, wallH, 12), mat.teakWood);
      p.position.set(x, wallH/2 + 0.3, z);
      p.castShadow = true;
      scene.add(p);
      
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 12), mat.brass);
      ring.position.set(x, 0.4, z);
      scene.add(ring);
    };

    // --- ASSEMBLY LAYER (Inspired by image_23a4da.jpg) ---
    // Ground and Site Layout
    const terrain = new THREE.Mesh(new THREE.PlaneGeometry(50, 40), mat.lawn);
    terrain.rotation.x = -Math.PI * 0.5;
    terrain.receiveShadow = true;
    scene.add(terrain);

    const drive = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.02, 12.0), mat.driveway);
    drive.position.set(4.5, 0.01, hD + 3);
    drive.receiveShadow = true;
    scene.add(drive);

    const foundation = new THREE.Mesh(new THREE.BoxGeometry(houseW, 0.3, houseD), mat.euroMarble);
    foundation.position.set(0, 0.15, 0);
    foundation.receiveShadow = true;
    scene.add(foundation);

    // Main Structural Shell
    createWall(houseW, wallThick, wallH, 0, hD - wallThick/2); 
    createWall(houseW, wallThick, wallH, 0, -hD + wallThick/2); 
    createWall(wallThick, houseD, wallH, -hW + wallThick/2, 0); 
    createWall(wallThick, houseD, wallH, hW - wallThick/2, 0); 

    // Dynamic split pitched roofs from image_23a4da.jpg
    createPitchedRoof(hW + 1, houseD + 0.8, 2.4, -4.0, wallH + 0.3, 0); 
    createPitchedRoof(hW + 1, houseD + 0.8, 2.0, 4.0, wallH + 0.3, 0);  

    // Traditional Central Indian Courtyard (Angan Core)
    const anganW = 3.8;
    const anganD = 3.8;
    createTeakPillar(-anganW/2, -anganD/2);
    createTeakPillar(anganW/2, -anganD/2);
    createTeakPillar(-anganW/2, anganD/2);
    createTeakPillar(anganW/2, anganD/2);

    const courtyardFloor = new THREE.Mesh(new THREE.BoxGeometry(anganW - 0.2, 0.04, anganD - 0.2), mat.terracottaTile);
    courtyardFloor.position.set(0, 0.31, 0);
    scene.add(courtyardFloor);

    // Indoor Spaces & Partitions
    createWall(2.5, wallThick, wallH, -hW + 1.25, -2.5); // Mandir partitions
    createWall(wallThick, 2.5, wallH, -hW + 2.5, -hD + 1.25);
    const mandirShrine = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.5, 0.8), mat.brass);
    mandirShrine.position.set(-hW + 1.2, 0.3 + 0.75, -hD + 1.2);
    scene.add(mandirShrine);

    createWall(4.5, wallThick, wallH, hW - 2.25, -2.2); // European Kitchen divider
    const kitchenIsland = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.9, 0.8), mat.teakWood);
    kitchenIsland.position.set(hW - 2.2, 0.3 + 0.45, -hD + 1.8);
    scene.add(kitchenIsland);

    // --- AUTOMATED VIRTUAL TOUR SCRIPTING MATRIX ---
    // Waypoints that cycle smoothly through the space automatically
    const tourWaypoints = [
      { pos: [0, 8, 22], target: [0, 1.5, 0] },       // Exterior Facade
      { pos: [4, 3, 4], target: [0, 1.2, 0] },         // Angan Left View
      { pos: [-3, 2, -2], target: [-hW+1.2, 1.2, -hD+1.2] }, // Pooja Mandir Focus
      { pos: [3, 2.5, -2], target: [hW-2.2, 1.0, -hD+1.8] },  // Modern Euro-Kitchen
      { pos: [-2, 3, 3], target: [-4, 1.0, 2] },       // Deep Interior Living Area
      { pos: [0, 14, 26], target: [0, 1.0, 0] }       // Aerial Returning Loop Entry
    ];

    let currentWaypointIndex = 0;
    let transitionStartTime = performance.now();
    const WAYPOINT_STAY_DURATION = 3500; // Time spent pausing at each space (ms)
    const TRANSITION_FLIGHT_TIME = 2500; // Time traveling between spaces (ms)
    let isTransitioning = true;

    // Track user mouse interaction to pause tour temporarily if they manually orbit
    let userInteracting = false;
    let interactionTimeout;

    controls.addEventListener('start', () => {
      userInteracting = true;
      clearTimeout(interactionTimeout);
    });

    controls.addEventListener('end', () => {
      interactionTimeout = setTimeout(() => {
        userInteracting = false;
        transitionStartTime = performance.now();
        // Snap system back to closest point smoothly
        tourWaypoints[currentWaypointIndex].pos = [camera.position.x, camera.position.y, camera.position.z];
      }, 5000); // Resume auto-tour 5 seconds after user releases mouse controls
    });

    // --- ANIMATION RENDERING MATRIX ENGINE ---
    const animate = (currentTime) => {
      requestAnimationFrame(animate);

      if (!userInteracting) {
        const elapsed = currentTime - transitionStartTime;

        if (isTransitioning) {
          const progress = Math.min(elapsed / TRANSITION_FLIGHT_TIME, 1.0);
          // Smooth architectural camera path ease curve
          const t = progress * progress * (3 - 2 * progress);

          const prevIndex = (currentWaypointIndex - 1 + tourWaypoints.length) % tourWaypoints.length;
          const startPoint = new THREE.Vector3(...tourWaypoints[prevIndex].pos);
          const endPoint = new THREE.Vector3(...tourWaypoints[currentWaypointIndex].pos);
          const startLook = new THREE.Vector3(...tourWaypoints[prevIndex].target);
          const endLook = new THREE.Vector3(...tourWaypoints[currentWaypointIndex].target);

          camera.position.lerpVectors(startPoint, endPoint, t);
          controls.target.lerpVectors(startLook, endLook, t);

          if (progress >= 1.0) {
            isTransitioning = false;
            transitionStartTime = currentTime;
          }
        } else {
          // Standing still holding perspective angle
          if (elapsed >= WAYPOINT_STAY_DURATION) {
            isTransitioning = true;
            currentWaypointIndex = (currentWaypointIndex + 1) % tourWaypoints.length;
            transitionStartTime = currentTime;
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);
    };

    // Kickstart the rendering loops safely
    requestAnimationFrame(animate);

    // Handle Viewport Resizing instantly
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
