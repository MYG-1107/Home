<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Home Tour</title>
  <style>
    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #0f172a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0f172a");

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(12, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.2, 0);
    controls.minDistance = 6;
    controls.maxDistance = 26;
    controls.minPolarAngle = 0.3;
    controls.maxPolarAngle = Math.PI * 0.48;

    let autoRotate = true;
    controls.autoRotate = autoRotate;
    controls.autoRotateSpeed = 0.6;
    let autoRotateResumeTimer;
    const pauseAutoRotate = () => {
      autoRotate = false;
      controls.autoRotate = false;
      clearTimeout(autoRotateResumeTimer);
    };
    const resumeAutoRotateSoon = () => {
      clearTimeout(autoRotateResumeTimer);
      autoRotateResumeTimer = setTimeout(() => {
        autoRotate = true;
        controls.autoRotate = true;
      }, 1500);
    };
    controls.addEventListener("start", pauseAutoRotate);
    controls.addEventListener("end", resumeAutoRotateSoon);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.85);
    directionalLight.position.set(10, 14, 8);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.set(2048, 2048);
    directionalLight.shadow.camera.left = -16;
    directionalLight.shadow.camera.right = 16;
    directionalLight.shadow.camera.top = 16;
    directionalLight.shadow.camera.bottom = -16;
    scene.add(directionalLight);

    const hemisphereLight = new THREE.HemisphereLight(0xbcd7ff, 0x1f2937, 0.35);
    hemisphereLight.position.set(0, 20, 0);
    scene.add(hemisphereLight);

    const houseGroup = new THREE.Group();
    scene.add(houseGroup);

    const wallMaterial = new THREE.MeshStandardMaterial({ color: "#f1ede5", roughness: 0.8 });
    const interiorWallMaterial = new THREE.MeshStandardMaterial({ color: "#e8e2d8", roughness: 0.9 });
    const trimMaterial = new THREE.MeshStandardMaterial({ color: "#cbd5e1", roughness: 0.6 });
    const doorMaterial = new THREE.MeshStandardMaterial({ color: "#6d4c3d", roughness: 0.7 });
    const floorBaseMaterial = new THREE.MeshStandardMaterial({ color: "#d7c9b7", roughness: 0.9 });
    const grassMaterial = new THREE.MeshStandardMaterial({ color: "#2f8f45", roughness: 0.9 });
    const woodMaterial = new THREE.MeshStandardMaterial({ color: "#b08968", roughness: 0.7 });
    const fabricMaterial = new THREE.MeshStandardMaterial({ color: "#9ca3af", roughness: 0.8 });
    const metalMaterial = new THREE.MeshStandardMaterial({ color: "#6b7280", roughness: 0.4, metalness: 0.3 });

    const houseWidth = 10;
    const houseDepth = 8;
    const halfWidth = houseWidth / 2;
    const halfDepth = houseDepth / 2;
    const wallThickness = 0.12;
    const outerWallHeight = 2.6;
    const innerWallHeight = 1.6;

    const base = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, 0.2, houseDepth), floorBaseMaterial);
    base.position.y = -0.1;
    base.receiveShadow = true;
    houseGroup.add(base);

    const addWall = (width, depth, x, z, height, material) => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      wall.position.set(x, height / 2, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      houseGroup.add(wall);
      return wall;
    };

    addWall(houseWidth, wallThickness, 0, halfDepth - wallThickness / 2, outerWallHeight, wallMaterial);
    addWall(houseWidth, wallThickness, 0, -halfDepth + wallThickness / 2, outerWallHeight, wallMaterial);
    addWall(wallThickness, houseDepth, -halfWidth + wallThickness / 2, 0, outerWallHeight, wallMaterial);
    addWall(wallThickness, houseDepth, halfWidth - wallThickness / 2, 0, outerWallHeight, wallMaterial);

    addWall(wallThickness, houseDepth - wallThickness * 2, 0, 0, innerWallHeight, interiorWallMaterial);
    addWall(halfWidth - wallThickness, wallThickness, -halfWidth / 2, 0, innerWallHeight, interiorWallMaterial);
    addWall(halfWidth - wallThickness, wallThickness, halfWidth / 2, 0, innerWallHeight, interiorWallMaterial);
    addWall(wallThickness, halfDepth - wallThickness, halfWidth / 2, -halfDepth / 2, innerWallHeight, interiorWallMaterial);

    const entryDoor = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 0.06), doorMaterial);
    entryDoor.position.set(2.8, 1.05, halfDepth - wallThickness / 2 - 0.03);
    entryDoor.castShadow = true;
    houseGroup.add(entryDoor);

    const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.25, 2.25, 0.04), trimMaterial);
    doorFrame.position.set(2.8, 1.13, halfDepth - wallThickness / 2 - 0.08);
    houseGroup.add(doorFrame);

    const SHORT_LABEL_LENGTH = 12;
    const LARGE_LABEL_FONT = 30;
    const SMALL_LABEL_FONT = 24;

    const createLabel = (text, size) => {
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      canvas.width = 256;
      canvas.height = 128;
      context.fillStyle = "rgba(15, 23, 42, 0.65)";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#f8fafc";
      const fontSize = text.length > SHORT_LABEL_LENGTH ? SMALL_LABEL_FONT : LARGE_LABEL_FONT;
      context.font = `600 ${fontSize}px "Segoe UI", sans-serif`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(text, canvas.width / 2, canvas.height / 2, canvas.width - 16);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      const label = new THREE.Mesh(new THREE.PlaneGeometry(size * 0.8, size * 0.4), material);
      label.rotation.x = -Math.PI / 2;
      return label;
    };

    const addRoom = ({ name, width, depth, centerX, centerZ, color }) => {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(width - 0.2, depth - 0.2),
        new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.05 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(centerX, 0.02, centerZ);
      floor.receiveShadow = true;
      houseGroup.add(floor);

      const label = createLabel(name, Math.min(width, depth));
      label.position.set(centerX, 0.05, centerZ);
      houseGroup.add(label);
    };

    const rooms = [
      { name: "Hall", width: 5, depth: 4, centerX: 2.5, centerZ: 2, color: "#f5e6c8" },
      { name: "Dining", width: 2.5, depth: 4, centerX: 1.25, centerZ: -2, color: "#f0d9d9" },
      { name: "Kitchen", width: 2.5, depth: 4, centerX: 3.75, centerZ: -2, color: "#d9f0e8" },
      { name: "Master Bedroom", width: 5, depth: 4, centerX: -2.5, centerZ: -2, color: "#e0ddf5" },
      { name: "Child Bedroom", width: 5, depth: 4, centerX: -2.5, centerZ: 2, color: "#dbeaf7" }
    ];

    rooms.forEach(addRoom);

    const addFurnitureBox = ({ name, width, height, depth, x, y = 0, z, material }) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y + height / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = name;
      houseGroup.add(mesh);
      return mesh;
    };

    const furnitureItems = [
      { name: "Hall Sofa Base", width: 1.8, height: 0.45, depth: 0.8, x: 3.4, z: 2.6, material: fabricMaterial },
      { name: "Hall Sofa Back", width: 1.8, height: 0.35, depth: 0.3, x: 3.4, y: 0.45, z: 3.0, material: fabricMaterial },
      { name: "Hall Coffee Table", width: 0.9, height: 0.35, depth: 0.6, x: 1.8, z: 2.1, material: woodMaterial },
      { name: "Dining Table", width: 1.2, height: 0.12, depth: 0.8, x: 1.25, y: 0.42, z: -2.0, material: woodMaterial },
      { name: "Dining Chair 1", width: 0.35, height: 0.45, depth: 0.35, x: 0.55, z: -1.5, material: woodMaterial },
      { name: "Dining Chair 2", width: 0.35, height: 0.45, depth: 0.35, x: 1.95, z: -1.5, material: woodMaterial },
      { name: "Dining Chair 3", width: 0.35, height: 0.45, depth: 0.35, x: 0.55, z: -2.5, material: woodMaterial },
      { name: "Dining Chair 4", width: 0.35, height: 0.45, depth: 0.35, x: 1.95, z: -2.5, material: woodMaterial },
      { name: "Kitchen Counter A", width: 1.9, height: 0.9, depth: 0.5, x: 4.3, z: -3.2, material: metalMaterial },
      { name: "Kitchen Counter B", width: 1.1, height: 0.9, depth: 0.5, x: 3.5, z: -1.6, material: metalMaterial },
      { name: "Master Bed", width: 2.2, height: 0.4, depth: 1.6, x: -3.4, z: -2.7, material: woodMaterial },
      { name: "Master Wardrobe", width: 0.5, height: 0.6, depth: 1.4, x: -4.4, z: -2.7, material: trimMaterial },
      { name: "Child Bed", width: 1.6, height: 0.35, depth: 1.2, x: -3.4, z: 2.7, material: woodMaterial },
      { name: "Child Storage", width: 0.6, height: 0.7, depth: 0.6, x: -1.2, z: 2.4, material: trimMaterial }
    ];

    furnitureItems.forEach(addFurnitureBox);

    const grass = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), grassMaterial);
    grass.rotation.x = -Math.PI * 0.5;
    grass.receiveShadow = true;
    scene.add(grass);

    const animate = () => {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
