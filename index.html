<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D House</title>
  <style>
    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #0f172a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0f172a");

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(7, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.6, 0);
    controls.minDistance = 4;
    controls.maxDistance = 20;

    let autoRotate = true;
    let autoRotateResumeTimer;
    const pauseAutoRotate = () => {
      autoRotate = false;
      clearTimeout(autoRotateResumeTimer);
    };
    const resumeAutoRotateSoon = () => {
      clearTimeout(autoRotateResumeTimer);
      autoRotateResumeTimer = setTimeout(() => {
        autoRotate = true;
      }, 1500);
    };
    controls.addEventListener("start", pauseAutoRotate);
    controls.addEventListener("end", resumeAutoRotateSoon);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
    directionalLight.position.set(8, 12, 6);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.set(2048, 2048);
    directionalLight.shadow.camera.left = -12;
    directionalLight.shadow.camera.right = 12;
    directionalLight.shadow.camera.top = 12;
    directionalLight.shadow.camera.bottom = -12;
    scene.add(directionalLight);

    const houseGroup = new THREE.Group();
    scene.add(houseGroup);

    const wallMaterial = new THREE.MeshStandardMaterial({ color: "#ece7de" });
    const roofMaterial = new THREE.MeshStandardMaterial({ color: "#7a3f2f", roughness: 0.8 });
    const trimMaterial = new THREE.MeshStandardMaterial({ color: "#c9d2da" });
    const doorMaterial = new THREE.MeshStandardMaterial({ color: "#5b3d2e" });
    const grassMaterial = new THREE.MeshStandardMaterial({ color: "#2f8f45" });

    const walls = new THREE.Mesh(new THREE.BoxGeometry(4, 2.6, 3), wallMaterial);
    walls.position.y = 1.3;
    walls.castShadow = true;
    walls.receiveShadow = true;
    houseGroup.add(walls);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.8, 4), roofMaterial);
    roof.position.y = 3.5;
    roof.rotation.y = Math.PI * 0.25;
    roof.castShadow = true;
    roof.receiveShadow = true;
    houseGroup.add(roof);

    const door = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.5, 0.08), doorMaterial);
    door.position.set(0, 0.75, 1.54);
    door.castShadow = true;
    houseGroup.add(door);

    const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.08, 1.68, 0.05), trimMaterial);
    doorFrame.position.set(0, 0.84, 1.5);
    houseGroup.add(doorFrame);

    const windowGeometry = new THREE.BoxGeometry(0.8, 0.65, 0.06);
    const windowMaterial = new THREE.MeshStandardMaterial({ color: "#9ad4ff", transparent: true, opacity: 0.8 });

    const leftWindow = new THREE.Mesh(windowGeometry, windowMaterial);
    leftWindow.position.set(-1.2, 1.5, 1.53);
    houseGroup.add(leftWindow);

    const rightWindow = new THREE.Mesh(windowGeometry, windowMaterial);
    rightWindow.position.set(1.2, 1.5, 1.53);
    houseGroup.add(rightWindow);

    const sideWindow = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.65, 0.8), windowMaterial);
    sideWindow.position.set(2.03, 1.5, 0);
    houseGroup.add(sideWindow);

    const grass = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), grassMaterial);
    grass.rotation.x = -Math.PI * 0.5;
    grass.receiveShadow = true;
    scene.add(grass);

    const animate = () => {
      requestAnimationFrame(animate);
      if (autoRotate) {
        houseGroup.rotation.y += 0.003;
      }
      controls.update();
      renderer.render(scene, camera);
    };

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
