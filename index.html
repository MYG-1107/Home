<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indo-European Luxury Villa | 3D Space Visualizer</title>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #0b0f19;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(11, 15, 25, 0.82);
      color: #f8fafc;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 320px;
    }

    #ui .title-area {
      margin-bottom: 4px;
    }

    #ui .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(45deg, #fcd34d, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #ui .subtitle {
      font-size: 10px;
      color: #fb923c;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    #ui .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    #ui button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }

    #ui button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    #ui button.active {
      background: #fb923c;
      color: #0b0f19;
      border-color: #fb923c;
      box-shadow: 0 0 12px rgba(251, 146, 60, 0.3);
    }

    #ui .hint {
      font-size: 11px;
      line-height: 1.5;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="title-area">
      <div class="title">Indo-Euro Villa</div>
      <div class="subtitle">Traditional Fusion Concept</div>
    </div>
    <div class="buttons">
      <button class="active" data-view="facade">Exterior Facade</button>
      <button data-view="angan">Central Angan</button>
      <button data-view="pooja">Pooja Mandir</button>
      <button data-view="baithak">Euro-Baithak</button>
      <button data-view="kitchen">Euro-Kitchen</button>
      <button data-view="veranda">Front Veranda</button>
    </div>
    <div class="hint">
      Inspired by <strong>image_23a4da.jpg</strong> layout. Integrates a classic inner open courtyard model with European architectural precision.
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // --- HOUSE DIMENSIONS ---
    const houseW = 16;
    const houseD = 12;
    const hW = houseW / 2;
    const hD = houseD / 2;
    const wallThick = 0.22;
    const wallH = 3.4; // Elevated ceilings typical of premium Indian estates

    // --- ENGINE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1424);
    scene.fog = new THREE.FogExp2(0x0f1424, 0.012);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(26, 16, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.0, 0);
    controls.maxPolarAngle = Math.PI * 0.45;

    // --- ENVIRONMENTAL SUNLIGHT SETUP ---
    const ambientLight = new THREE.AmbientLight(0xfff7ed, 0.3);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0fedaa7, 1.8); // Warm gold tropical sunlight
    sunLight.position.set(24, 30, 16);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(4096, 4096);
    sunLight.shadow.camera.left = -18;
    sunLight.shadow.camera.right = 18;
    sunLight.shadow.camera.top = 18;
    sunLight.shadow.camera.bottom = -18;
    sunLight.shadow.bias = -0.0001;
    scene.add(sunLight);

    const skyLight = new THREE.HemisphereLight(0xbae6fd, 0x292524, 0.6);
    scene.add(skyLight);

    // --- MATERIAL MATRIX ---
    const mat = {
      stuccoWall: new THREE.MeshStandardMaterial({ color: "#fef3c7", roughness: 0.6 }), // Soft warm Indian stucco
      terracottaTile: new THREE.MeshStandardMaterial({ color: "#c2410c", roughness: 0.55 }), // Authentic roof tiles
      teakWood: new THREE.MeshStandardMaterial({ color: "#78350f", roughness: 0.35, metalness: 0.1 }), // Pillars & framing
      euroMarble: new THREE.MeshStandardMaterial({ color: "#f8fafc", roughness: 0.1, metalness: 0.05 }), // Sleek flooring
      brass: new THREE.MeshStandardMaterial({ color: "#d97706", roughness: 0.2, metalness: 0.8 }), // Traditional hardware
      glass: new THREE.MeshStandardMaterial({ color: "#e0f2fe", roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.25 }),
      frame: new THREE.MeshStandardMaterial({ color: "#1c1917", roughness: 0.4 }),
      lawn: new THREE.MeshStandardMaterial({ color: "#15803d", roughness: 0.95 }),
      driveway: new THREE.MeshStandardMaterial({ color: "#78716c", roughness: 0.7 })
    };

    // --- BASE SITE PLAN ---
    const terrain = new THREE.Mesh(new THREE.PlaneGeometry(42, 32), mat.lawn);
    terrain.rotation.x = -Math.PI * 0.5;
    terrain.receiveShadow = true;
    scene.add(terrain);

    const drive = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.02, 10.0), mat.driveway);
    drive.position.set(4.5, 0.01, hD + 2);
    drive.receiveShadow = true;
    scene.add(drive);

    const foundation = new THREE.Mesh(new THREE.BoxGeometry(houseW, 0.3, houseD), mat.euroMarble);
    foundation.position.set(0, 0.15, 0);
    foundation.receiveShadow = true;
    scene.add(foundation);

    // --- STRUCTURAL FUNCTIONS ---
    const createWall = (w, d, h, x, z, material = mat.stuccoWall) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      b.position.set(x, h/2 + 0.3, z);
      b.castShadow = true;
      b.receiveShadow = true;
      scene.add(b);
    };

    const createPitchedRoof = (w, d, h, x, y, z, rotY = 0) => {
      const geom = new THREE.ConeGeometry(w * 0.65, h, 4);
      geom.rotateY(Math.PI * 0.25); // Form square hip-roof shape
      geom.scale(1, 1, d / w);
      const roofMesh = new THREE.Mesh(geom, mat.terracottaTile);
      roofMesh.position.set(x, y + h/2, z);
      roofMesh.rotation.y = rotY;
      roofMesh.castShadow = true;
      scene.add(roofMesh);
    };

    const createTeakPillar = (x, z, height = wallH) => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, height, 8), mat.teakWood);
      p.position.set(x, height/2 + 0.3, z);
      p.castShadow = true;
      scene.add(p);
      
      // Brass structural baseline rings
      const baseRing = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.15, 12), mat.brass);
      baseRing.position.set(x, 0.38, z);
      scene.add(baseRing);
    };

    // --- EXTERIOR ARCHITECTURE (Inspired by image_23a4da.jpg) ---
    // Perimeter Shell Setup
    createWall(houseW, wallThick, wallH, 0, hD - wallThick/2); // Front Exterior
    createWall(houseW, wallThick, wallH, 0, -hD + wallThick/2); // Back Exterior
    createWall(wallThick, houseD, wallH, -hW + wallThick/2, 0); // Left Wing
    createWall(wallThick, houseD, wallH, hW - wallThick/2, 0); // Right Wing (Garage Side)

    // Pitched Spanish/Mediterranean Clay Roofs from image_23a4da.jpg
    createPitchedRoof(hW + 1, houseD + 0.8, 2.2, -4.0, wallH + 0.3, 0); // Left Elevated Block
    createPitchedRoof(hW + 1, houseD + 0.8, 1.8, 4.0, wallH + 0.3, 0);  // Right Symmetrical Block

    // --- INTERIOR SPATIAL MATRIX: TRADITIONAL INDIAN ANGAN FUSION ---
    // Creating the open central sky courtyard (Angan) right in the center
    const anganW = 3.5;
    const anganD = 3.5;

    // Cutout look for courtyard interior limits
    createWall(wallThick, anganD, wallH, -anganW/2, 0);
    createWall(wallThick, anganD, wallH, anganW/2, 0);
    createWall(anganW, wallThick, wallH, 0, -anganD/2);
    createWall(anganW, wallThick, wallH, 0, anganD/2);

    // Place traditional pillars on the perimeter corners of the courtyard boundary
    createTeakPillar(-anganW/2 - 0.2, -anganD/2 - 0.2);
    createTeakPillar(anganW/2 + 0.2, -anganD/2 - 0.2);
    createTeakPillar(-anganW/2 - 0.2, anganD/2 + 0.2);
    createTeakPillar(anganW/2 + 0.2, anganD/2 + 0.2);

    // Center courtyard flooring accent (sunken look)
    const courtyardFloor = new THREE.Mesh(new THREE.BoxGeometry(anganW - 0.1, 0.05, anganD - 0.1), mat.terracottaTile);
    courtyardFloor.position.set(0, 0.28, 0);
    scene.add(courtyardFloor);

    // --- INDO-EUROPEAN INTERNAL DIVISION SECTIONS ---
    // Traditional Pooja Mandir Room (North East alignment)
    createWall(2.5, wallThick, wallH, -hW + 1.25, -2.5);
    createWall(wallThick, 2.5, wallH, -hW + 2.5, -hD + 1.25);
    // Brass Pooja shrine structural box inside
    const mandir = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.8), mat.brass);
    mandir.position.set(-hW + 1.0, 0.3 + 0.7, -hD + 1.0);
    scene.add(mandir);

    // European Minimalist Open-Concept Kitchen (Sleek handleless layout)
    createWall(4.5, wallThick, wallH, hW - 2.25, -2.2); // Divider wall
    const counterTop = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.9, 0.75), mat.frame);
    counterTop.position.set(hW - 2.0, 0.3 + 0.45, -hD + 1.5);
    scene.add(counterTop);

    // Main Baithak (Traditional Indian Low-seating lounge styled with European glass framework)
    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.35, 2.2), mat.teakWood);
    sofaBase.position.set(-4.5, 0.3 + 0.175, 2.8);
    scene.add(sofaBase);

    // --- FLOATING CAMERA NAVIGATION PATH MATRIX ---
    const views = {
      facade: { target: [0, 1.5, 0], pos: [24, 12, 24] },
      angan: { target: [0, 1.1, 0], pos: [4.0, 3.5, 4.0] },
      pooja: { target: [-hW + 1.0, 1.0, -hD + 1.0], pos: [-4.2, 2.2, -1.8] },
      baithak: { target: [-4.5, 0.8, 2.8], pos: [-1.5, 2.4, 1.5] },
      kitchen: { target: [hW - 2.0, 1.1, -hD + 1.5], pos: [2.5, 2.6, -1.0] },
      veranda: { target: [0, 1.2, hD], pos: [0, 2.0, hD + 6.0] }
    };

    const TWEEN_DURATION = 1400;
    let cameraTween = null;

    const executeViewTransition = (viewKey) => {
      const config = views[viewKey];
      if (!config) return;

      cameraTween = {
        start: performance.now(),
        fromPos: camera.position.clone(),
        toPos: new THREE.Vector3(...config.pos),
        fromLook: controls.target.clone(),
        toLook: new THREE.Vector3(...config.target)
      };
    };

    const uiButtons = document.querySelectorAll("#ui button");
    uiButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        uiButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        executeViewTransition(btn.dataset.view);
      });
    });

    // --- ANIMATION REFRESH ENGINE ---
    const animate = () => {
      requestAnimationFrame(animate);

      if (cameraTween) {
        const elapsed = performance.now() - cameraTween.start;
        const progress = Math.min(elapsed / TWEEN_DURATION, 1.0);
        
        // Custom cubic smooth-step camera path tracking
        const t = progress * progress * (3 - 2 * progress);

        camera.position.lerpVectors(cameraTween.fromPos, cameraTween.toPos, t);
        controls.target.lerpVectors(cameraTween.fromLook, cameraTween.toLook, t);

        if (progress >= 1.0) cameraTween = null;
      }

      controls.update();
      renderer.render(scene, camera);
    };

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
