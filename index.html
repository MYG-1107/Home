<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Dream Villa | Interactive 3D Experience</title>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #090d16;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(9, 13, 22, 0.75);
      color: #f8fafc;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 320px;
    }

    #ui .title-area {
      margin-bottom: 4px;
    }

    #ui .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #ui .subtitle {
      font-size: 11px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    #ui .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    #ui button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }

    #ui button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transform: translateY(-1px);
    }

    #ui button.active {
      background: #38bdf8;
      color: #090d16;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    #ui .hint {
      font-size: 11px;
      line-height: 1.5;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="title-area">
      <div class="title">The Perfect House</div>
      <div class="subtitle">Architectural Tour</div>
    </div>
    <div class="buttons">
      <button class="active" data-view="overview">Overview</button>
      <button data-view="hall">Living Hall</button>
      <button data-view="dining">Dining Oasis</button>
      <button data-view="kitchen">Chef Kitchen</button>
      <button data-view="master">Master Suite</button>
      <button data-view="child">Kids Sanctuary</button>
      <button data-view="play">Leisure Yard</button>
      <button data-view="front">Grand Veranda</button>
    </div>
    <div class="hint">
      <strong>Controls:</strong> Left click & drag to orbit scene. Scroll to zoom in/out. Click any location tab to move the camera smoothly inside.
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // --- ARCHITECTURAL DIMENSIONS ---
    const houseW = 14;
    const houseD = 10;
    const hW = houseW / 2;
    const hD = houseD / 2;
    const wallThick = 0.18;
    const wallH = 3.0;

    // --- ENGINE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(22, 14, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.6, 0);
    controls.minDistance = 5;
    controls.maxDistance = 50;
    controls.maxPolarAngle = Math.PI * 0.46;

    // --- ADVANCED PHYSICALLY-BASED LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.6);
    sunLight.position.set(22, 28, 14);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(4096, 4096); // Sharp crisp shadows
    sunLight.shadow.camera.left = -16;
    sunLight.shadow.camera.right = 16;
    sunLight.shadow.camera.top = 16;
    sunLight.shadow.camera.bottom = -16;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 70;
    sunLight.shadow.bias = -0.0002;
    scene.add(sunLight);

    const skyLight = new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 0.7);
    skyLight.position.set(0, 40, 0);
    scene.add(skyLight);

    // --- HIGH-FIDELITY LUXURY MATERIALS ---
    const mat = {
      outerWall: new THREE.MeshStandardMaterial({ color: "#f8fafc", roughness: 0.5, metalness: 0.0 }),
      innerWall: new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.85 }),
      accentWall: new THREE.MeshStandardMaterial({ color: "#1e293b", roughness: 0.2, metalness: 0.3 }),
      foundation: new THREE.MeshStandardMaterial({ color: "#334155", roughness: 0.7 }),
      lawn: new THREE.MeshStandardMaterial({ color: "#166534", roughness: 0.9 }),
      terrace: new THREE.MeshStandardMaterial({ color: "#64748b", roughness: 0.6 }),
      glass: new THREE.MeshStandardMaterial({ color: "#f0f9ff", roughness: 0.05, metalness: 0.95, transparent: true, opacity: 0.3 }),
      frame: new THREE.MeshStandardMaterial({ color: "#0f172a", roughness: 0.3, metalness: 0.8 }),
      hardwood: new THREE.MeshStandardMaterial({ color: "#451a03", roughness: 0.4, metalness: 0.1 }),
      marbleLiving: new THREE.MeshStandardMaterial({ color: "#f1f5f9", roughness: 0.12, metalness: 0.1 }),
      slateKitchen: new THREE.MeshStandardMaterial("#1e293b"),
      carpetBed: new THREE.MeshStandardMaterial({ color: "#e2e8f0", roughness: 0.9 }),
      woodLight: new THREE.MeshStandardMaterial({ color: "#b45309", roughness: 0.5 }),
      fabricSofa: new THREE.MeshStandardMaterial({ color: "#475569", roughness: 0.8 }),
      fabricWhite: new THREE.MeshStandardMaterial({ color: "#f8fafc", roughness: 0.75 }),
      chrome: new THREE.MeshStandardMaterial({ color: "#cbd5e1", roughness: 0.1, metalness: 0.95 }),
      poolWater: new THREE.MeshStandardMaterial({ color: "#0ea5e9", roughness: 0.1, metalness: 0.5, transparent: true, opacity: 0.7 })
    };

    // --- SITE & ARCHITECTURE LAYOUT ---
    const yard = new THREE.Mesh(new THREE.PlaneGeometry(36, 28), mat.lawn);
    yard.rotation.x = -Math.PI * 0.5;
    yard.receiveShadow = true;
    scene.add(yard);

    const base = new THREE.Mesh(new THREE.BoxGeometry(houseW, 0.2, houseD), mat.foundation);
    base.position.set(0, 0.1, 0);
    base.receiveShadow = true;
    scene.add(base);

    // Procedural Architecture Builders
    const makeWall = (w, d, h, x, z, material = mat.innerWall) => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      wall.position.set(x, h / 2 + 0.2, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
    };

    const makeApertureWindow = (w, h, x, y, z, rot = 0) => {
      const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), mat.glass);
      glass.position.set(x, y + 0.2, z);
      glass.rotation.y = rot;
      scene.add(glass);

      const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.08, h + 0.08, 0.1), mat.frame);
      frame.position.set(x, y + 0.2, z);
      frame.rotation.y = rot;
      frame.castShadow = true;
      scene.add(frame);
    };

    // Structural Perimeter (With openings built natively into architecture)
    makeWall(houseW, wallThick, wallH, 0, hD - wallThick/2, mat.outerWall); // Front
    makeWall(houseW, wallThick, wallH, 0, -hD + wallThick/2, mat.outerWall); // Back
    makeWall(wallThick, houseD, wallH, -hW + wallThick/2, 0, mat.outerWall); // Left
    makeWall(wallThick, houseD, wallH, hW - wallThick/2, 0, mat.outerWall); // Right

    // Interior Spatial Partitioning Matrix
    makeWall(wallThick, houseD - 0.4, wallH - 0.4, 0, 0); // Core spine partition
    makeWall(hW - 0.2, wallThick, wallH - 0.4, -hW / 2, 0); // Master/Kids room boundary
    makeWall(hW - 0.2, wallThick, wallH - 0.4, hW / 2, 0); // Living/Kitchen divider
    makeWall(wallThick, hD - 0.2, wallH - 0.4, hW / 2, -hD / 2); // Kitchen/Dining boundary

    // Luxury Modern Panoramic Window Apertures
    makeApertureWindow(3.5, 2.2, 2.5, 1.1, hD - 0.02); // Main Lounge Window
    makeApertureWindow(2.2, 2.0, -3.5, 1.2, hD - 0.02); // Kids Sanctuary Window
    makeApertureWindow(2.5, 2.0, -hW + 0.02, 1.2, -2.5, Math.PI / 2); // Master Suite Panoramic Window
    makeApertureWindow(2.5, 1.4, hW - 0.02, 1.5, -2.5, Math.PI / 2); // Kitchen Modern Splashback Window

    // Grand Entrance Veranda & Concrete Design Details
    const veranda = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.12, 2.5), mat.terrace);
    veranda.position.set(2.5, 0.16, hD + 1.25);
    veranda.receiveShadow = true;
    scene.add(veranda);

    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, wallH, 16), mat.frame);
    pillar.position.set(0.6, wallH / 2 + 0.2, hD + 2.2);
    pillar.castShadow = true;
    scene.add(pillar);

    // Architectural Roof Slab Design
    const roof = new THREE.Mesh(new THREE.BoxGeometry(houseW + 0.5, 0.15, houseD + 0.5), mat.outerWall);
    roof.position.set(0, wallH + 0.2, 0);
    roof.castShadow = true;
    scene.add(roof);

    // --- REFINED PREMIUM INTERIOR SURFACE ZONES ---
    const surfaces = [
      { w: hW, d: hD, cx: hW / 2, cz: hD / 2, floorMat: mat.marbleLiving }, // Living Hall
      { w: hW / 2, d: hD, cx: hW / 4, cz: -hD / 2, floorMat: mat.hardwood }, // Dining Space
      { w: hW / 2, d: hD, cx: (3 * hW) / 4 - hW / 2, cz: -hD / 2, floorMat: mat.slateKitchen }, // Kitchen
      { w: hW, d: hD, cx: -hW / 2, cz: -hD / 2, floorMat: mat.carpetBed }, // Master Bedroom
      { w: hW, d: hD, cx: -hW / 2, cz: hD / 2, floorMat: mat.carpetBed } // Kids Sanctuary
    ];

    surfaces.forEach(s => {
      const surfaceFloor = new THREE.Mesh(new THREE.PlaneGeometry(s.w - 0.05, s.d - 0.05), s.floorMat);
      surfaceFloor.rotation.x = -Math.PI * 0.5;
      surfaceFloor.position.set(s.cx, 0.21, s.cz);
      surfaceFloor.receiveShadow = true;
      scene.add(surfaceFloor);
    });

    // --- ACCURATE FURNITURE MODELS COMPOSITIONS ---
    const makeComplexObject = (w, h, d, x, y, z, material) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y + h / 2 + 0.21, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    };

    // Living Room Setup (Sectional Sofa + Table + Feature Wall)
    makeComplexObject(3.0, 0.45, 0.9, 3.5, 0, 3.2, mat.fabricSofa); // Long Sectional Sofa Base
    makeComplexObject(0.9, 0.45, 1.6, 1.6, 0, 2.5, mat.fabricSofa); // Chaise Lounge Section
    makeComplexObject(1.4, 0.3, 0.7, 3.5, 0, 1.6, mat.woodLight); // Minimalist Coffee Table

    // Master Bedroom Setup (Luxury Bed Frame + Headboard Assembly)
    makeComplexObject(2.1, 0.4, 1.9, -3.5, 0, -2.5, mat.woodLight); // King Size Bed Frame
    makeComplexObject(1.9, 0.3, 1.7, -3.4, 0.2, -2.5, mat.fabricWhite); // Mattress Overlay
    makeComplexObject(2.2, 1.2, 0.1, -4.5, 0, -2.5, mat.accentWall); // Decorative Bedside Headboard Pane

    // Designer Kitchen Hub
    makeComplexObject(2.6, 0.9, 0.65, 5.0, 0, -3.8, mat.accentWall); // Premium Granite Kitchen Island
    makeComplexObject(0.75, 1.9, 0.75, 6.0, 0, -1.5, mat.chrome); // Industrial Grade Double Refrigerator

    // Minimalist Luxury Dining Area
    makeComplexObject(1.6, 0.75, 0.9, 1.8, 0, -2.2, mat.hardwood); // Solid Wood Dining Slab
    makeComplexObject(0.4, 0.45, 0.4, 1.2, 0, -1.4, mat.fabricSofa); // Set of Modern Dining Chairs
    makeComplexObject(0.4, 0.45, 0.4, 2.4, 0, -1.4, mat.fabricSofa);
    makeComplexObject(0.4, 0.45, 0.4, 1.2, 0, -3.0, mat.fabricSofa);
    makeComplexObject(0.4, 0.45, 0.4, 2.4, 0, -3.0, mat.fabricSofa);

    // Outdoor Resort Elements (Sun Deck & Integrated Swimming Pool)
    const deck = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.08, 5.0), mat.hardwood);
    deck.position.set(-11, 0.1, 2.0);
    deck.receiveShadow = true;
    scene.add(deck);

    const poolRim = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.2, 3.5), mat.foundation);
    poolRim.position.set(-11, 0.15, 2.0);
    scene.add(poolRim);

    const waterSurface = new THREE.Mesh(new THREE.PlaneGeometry(4.1, 3.1), mat.poolWater);
    waterSurface.rotation.x = -Math.PI * 0.5;
    waterSurface.position.set(-11, 0.22, 2.0);
    scene.add(waterSurface);

    // --- INTERACTIVE NAVIGATIONAL CAMERA GRID COORDINATES ---
    const views = {
      overview: { target: [0, 0.5, 0], pos: [22, 14, 22] },
      hall: { target: [3.2, 0.6, 2.4], pos: [5.0, 3.0, 6.2] },
      dining: { target: [1.8, 0.7, -2.2], pos: [4.2, 2.8, -0.2] },
      kitchen: { target: [5.0, 0.8, -3.0], pos: [2.2, 3.2, -1.2] },
      master: { target: [-3.5, 0.6, -2.5], pos: [-0.5, 2.8, -0.2] },
      child: { target: [-3.5, 0.6, 2.5], pos: [-0.5, 2.8, 0.5] },
      play: { target: [-11.0, 0.3, 2.0], pos: [-16.5, 4.0, 7.5] },
      front: { target: [2.5, 0.8, 4.5], pos: [2.5, 2.2, 8.8] }
    };

    // Smooth Vector Lerp Interpolation Engine
    const INTERPOLATION_WINDOW = 1200; 
    let activeTween = null;

    const lerpMath = (vStart, vEnd, ratio) => {
      return new THREE.Vector3().lerpVectors(vStart, vEnd, ratio);
    };

    const runCameraTween = (targetKey) => {
      const targetNode = views[targetKey];
      if (!targetNode) return;

      activeTween = {
        startEpoch: performance.now(),
        fromPos: camera.position.clone(),
        toPos: new THREE.Vector3(...targetNode.pos),
        fromLook: controls.target.clone(),
        toLook: new THREE.Vector3(...targetNode.target)
      };
    };

    // UI Click Event Binding Distribution Loop
    const inputButtons = document.querySelectorAll("#ui button");
    inputButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        inputButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        runCameraTween(btn.dataset.view);
      });
    });

    // --- REALTIME ANIMATION RENDER LOOP ---
    const runLoop = () => {
      requestAnimationFrame(runLoop);

      if (activeTween) {
        const delta = performance.now() - activeTween.startEpoch;
        const timelineProgress = Math.min(delta / INTERPOLATION_WINDOW, 1.0);
        
        // Custom Smooth-Step Transform Interpolation S-Curve
        const sCurveAlpha = timelineProgress * timelineProgress * (3 - 2 * timelineProgress);

        camera.position.copy(lerpMath(activeTween.fromPos, activeTween.toPos, sCurveAlpha));
        controls.target.copy(lerpMath(activeTween.fromLook, activeTween.toLook, sCurveAlpha));

        if (timelineProgress >= 1.0) activeTween = null;
      }

      controls.update();
      renderer.render(scene, camera);
    };

    runLoop();

    // High Density Display Window Resizing Event Handler
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
