<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury 3D Home Tour | Architectural Visualization</title>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #0b0f19;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(11, 15, 25, 0.65);
      color: #f8fafc;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 300px;
    }

    #ui .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: linear-gradient(45deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #ui .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    #ui button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }

    #ui button:hover {
      background: #f8fafc;
      color: #0b0f19;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    #ui button.active {
      background: #38bdf8;
      color: #0b0f19;
      border-color: #38bdf8;
    }

    #ui .hint {
      font-size: 11px;
      line-height: 1.4;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="title">Luxury 2-BHK Experiential</div>
    <div class="buttons">
      <button class="active" data-view="overview">Overview</button>
      <button data-view="hall">Living Hall</button>
      <button data-view="dining">Dining Space</button>
      <button data-view="kitchen">Gourmet Kitchen</button>
      <button data-view="master">Master Suite</button>
      <button data-view="child">Kids Bedroom</button>
      <button data-view="play">Recreation Yard</button>
      <button data-view="front">Front Veranda</button>
    </div>
    <div class="hint">Left Click + Drag to explore. Use the control grid to step inside specific rooms seamlessly.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Architectural System Dimensions
    const houseWidth = 12;
    const houseDepth = 9;
    const halfWidth = houseWidth / 2;
    const halfDepth = houseDepth / 2;
    const wallThickness = 0.15; // Realistic wall width
    const outerWallHeight = 2.8;
    const innerWallHeight = 2.4;

    // Environmental Parameters
    const SKY_COLOR = 0x0f172a;
    const GROUND_COLOR = 0x1e293b;

    // Scene & Engine Settings
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(SKY_COLOR);
    scene.fog = new THREE.FogExp2(SKY_COLOR, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(18, 12, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Photorealistic Pipeline Configurations
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Orbit Dynamics
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.8, 0);
    controls.minDistance = 4;
    controls.maxDistance = 45;
    controls.minPolarAngle = 0.1;
    controls.maxPolarAngle = Math.PI * 0.47;

    // Soft Physical Lighting Model
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.4);
    sunLight.position.set(18, 22, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -15;
    sunLight.shadow.camera.right = 15;
    sunLight.shadow.camera.top = 15;
    sunLight.shadow.camera.bottom = -15;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 60;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const skyLight = new THREE.HemisphereLight(0xddf2ff, 0x334155, 0.6);
    skyLight.position.set(0, 30, 0);
    scene.add(skyLight);

    // Architectural Structural Groups
    const houseGroup = new THREE.Group();
    const propertyGroup = new THREE.Group();
    scene.add(houseGroup);
    scene.add(propertyGroup);

    // High Fidelity PBR Materials Configuration
    const materials = {
      outerWall: new THREE.MeshStandardMaterial({ color: "#f8fafc", roughness: 0.85, metalness: 0.0 }),
      innerWall: new THREE.MeshStandardMaterial({ color: "#f1f5f9", roughness: 0.9, metalness: 0.0 }),
      trim: new THREE.MeshStandardMaterial({ color: "#1e293b", roughness: 0.4, metalness: 0.1 }),
      hardwood: new THREE.MeshStandardMaterial({ color: "#78350f", roughness: 0.35, metalness: 0.05 }),
      tileLiving: new THREE.MeshStandardMaterial({ color: "#e2e8f0", roughness: 0.15, metalness: 0.1 }),
      tileKitchen: new THREE.MeshStandardMaterial({ color: "#0f172a", roughness: 0.2, metalness: 0.2 }),
      tileBed: new THREE.MeshStandardMaterial({ color: "#cbd5e1", roughness: 0.4 }),
      grass: new THREE.MeshStandardMaterial({ color: "#15803d", roughness: 0.95 }),
      stoneWalk: new THREE.MeshStandardMaterial({ color: "#475569", roughness: 0.8 }),
      glass: new THREE.MeshStandardMaterial({ color: "#e0f2fe", roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.4 }),
      furnitureWood: new THREE.MeshStandardMaterial({ color: "#451a03", roughness: 0.5 }),
      fabricSofa: new THREE.MeshStandardMaterial({ color: "#64748b", roughness: 0.85 }),
      applianceSteel: new THREE.MeshStandardMaterial({ color: "#94a3b8", roughness: 0.25, metalness: 0.85 }),
      accentItems: new THREE.MeshStandardMaterial({ color: "#f59e0b", roughness: 0.5 }),
      fence: new THREE.MeshStandardMaterial({ color: "#334155", roughness: 0.7 })
    };

    // Property Framework Creation
    const siteGround = new THREE.Mesh(new THREE.PlaneGeometry(32, 26), materials.grass);
    siteGround.rotation.x = -Math.PI * 0.5;
    siteGround.receiveShadow = true;
    propertyGroup.add(siteGround);

    const foundation = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, 0.15, houseDepth), materials.trim);
    foundation.position.y = 0.075;
    foundation.receiveShadow = true;
    houseGroup.add(foundation);

    // Wall Assembly Engine
    const buildWall = (w, d, h, x, z, mat) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, h / 2 + 0.15, z);
      m.castShadow = true;
      m.receiveShadow = true;
      houseGroup.add(m);
    };

    // Perimeter Structural Boundary
    buildWall(houseWidth, wallThickness, outerWallHeight, 0, halfDepth - wallThickness/2, materials.outerWall);
    buildWall(houseWidth, wallThickness, outerWallHeight, 0, -halfDepth + wallThickness/2, materials.outerWall);
    buildWall(wallThickness, houseDepth, outerWallHeight, -halfWidth + wallThickness/2, 0, materials.outerWall);
    buildWall(wallThickness, houseDepth, outerWallHeight, halfWidth - wallThickness/2, 0, materials.outerWall);

    // Interior Structural Dividers
    buildWall(wallThickness, houseDepth - 0.3, innerWallHeight, 0, 0, materials.innerWall); 
    buildWall(halfWidth - 0.15, wallThickness, innerWallHeight, -halfWidth / 2, 0, materials.innerWall); 
    buildWall(halfWidth - 0.15, wallThickness, innerWallHeight, halfWidth / 2, 0, materials.innerWall); 
    buildWall(wallThickness, halfDepth - 0.15, innerWallHeight, halfWidth / 2, -halfDepth / 2, materials.innerWall);

    // Structural Openings (Windows and Structural Accents)
    const buildGlassAperture = (w, h, x, y, z, rot = 0) => {
      const pane = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), materials.glass);
      pane.position.set(x, y, z);
      pane.rotation.y = rot;
      houseGroup.add(pane);

      const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.08, h + 0.08, 0.08), materials.trim);
      frame.position.set(x, y, z);
      frame.rotation.y = rot;
      frame.castShadow = true;
      houseGroup.add(frame);
    };

    buildGlassAperture(1.6, 1.4, -3.5, 1.4, halfDepth - 0.02);
    buildGlassAperture(1.4, 1.4, 1.0, 1.4, halfDepth - 0.02);
    buildGlassAperture(1.6, 1.4, -halfWidth + 0.02, 1.4, -1.5, Math.PI / 2);
    buildGlassAperture(1.4, 1.4, halfWidth - 0.02, 1.4, -2.5, Math.PI / 2);

    // Exterior Features (Veranda / Entryway)
    const veranda = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.1, 2.0), materials.stoneWalk);
    veranda.position.set(3.0, 0.1, halfDepth + 1.0);
    veranda.receiveShadow = true;
    houseGroup.add(veranda);

    const pillarGeom = new THREE.CylinderGeometry(0.1, 0.12, outerWallHeight, 16);
    const pLeft = new THREE.Mesh(pillarGeom, materials.trim);
    pLeft.position.set(1.4, outerWallHeight / 2 + 0.1, halfDepth + 1.8);
    pLeft.castShadow = true;
    houseGroup.add(pLeft);
    const pRight = pLeft.clone();
    pRight.position.x = 4.6;
    houseGroup.add(pRight);

    // Floating Geometric Slab Roof Strategy (Enables Interior Visibility)
    const mainRoof = new THREE.Mesh(new THREE.BoxGeometry(houseWidth + 0.4, 0.15, houseDepth + 0.4), materials.outerWall);
    mainRoof.position.set(0, outerWallHeight + 0.2, 0);
    mainRoof.castShadow = true;
    houseGroup.add(mainRoof);

    // Architectural Plan Segmentation & Custom PBR Floors
    const internalRooms = [
      { name: "Living Hall", w: halfWidth, d: halfDepth, cx: halfWidth / 2, cz: halfDepth / 2, mat: materials.tileLiving },
      { name: "Dining Space", w: houseWidth / 4, d: halfDepth, cx: halfWidth / 4, cz: -halfDepth / 2, mat: materials.hardwood },
      { name: "Gourmet Kitchen", w: houseWidth / 4, d: halfDepth, cx: (3 * houseWidth) / 4 - halfWidth, cz: -halfDepth / 2, mat: materials.tileKitchen },
      { name: "Master Suite", w: halfWidth, d: halfDepth, cx: -halfWidth / 2, cz: -halfDepth / 2, mat: materials.tileBed },
      { name: "Kids Bedroom", w: halfWidth, d: halfDepth, cx: -halfWidth / 2, cz: halfDepth / 2, mat: materials.tileBed }
    ];

    internalRooms.forEach(r => {
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(r.w - 0.1, r.d - 0.1), r.mat);
      fl.rotation.x = -Math.PI * 0.5;
      fl.position.set(r.cx, 0.16, r.cz);
      fl.receiveShadow = true;
      houseGroup.add(fl);
    });

    // High Fidelity PBR Abstract Furniture Layering
    const appendAsset = (w, h, d, x, y, z, mat) => {
      const asset = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      asset.position.set(x, y + h / 2, z);
      asset.castShadow = true;
      asset.receiveShadow = true;
      houseGroup.add(asset);
    };

    // Living Room Layout Elements
    appendAsset(2.2, 0.5, 0.85, 3.2, 0.16, 3.0, materials.fabricSofa); // Main Lounge
    appendAsset(0.85, 0.5, 0.85, 1.6, 0.16, 2.2, materials.fabricSofa); // Armchair
    appendAsset(1.2, 0.35, 0.6, 3.2, 0.16, 1.8, materials.furnitureWood); // Modern Low Table

    // Suite Structural Bed Assemblages
    appendAsset(2.0, 0.5, 1.8, -3.2, 0.16, -2.4, materials.furnitureWood); // Master Bed Frame
    appendAsset(1.8, 0.45, 1.4, -3.2, 0.16, 2.5, materials.fabricSofa); // Guest Bed Frame

    // Kitchen Infrastructure Slabs
    appendAsset(2.4, 0.9, 0.6, 4.5, 0.16, -3.8, materials.applianceSteel); // Counter Unit
    appendAsset(0.7, 1.8, 0.75, 5.4, 0.16, -2.0, materials.applianceSteel); // Modern Refrigerator

    // Outdoor Landscaping System
    const playLawn = new THREE.Mesh(new THREE.BoxGeometry(7, 0.05, 5), materials.grass);
    playLawn.position.set(11, 0.02, 4);
    playLawn.receiveShadow = true;
    propertyGroup.add(playLawn);

    appendAsset(1.4, 1.2, 1.4, 11, 0.05, 4, materials.accentItems); // Sculptural Asset Platform

    // Navigation Coordinates System Matrix
    const navigationalNodes = {
      overview: { target: [0, 0.5, 0], pos: [15, 11, 15] },
      hall: { target: [3.0, 0.6, 2.2], pos: [5.2, 3.2, 5.8] },
      dining: { target: [1.5, 0.6, -2.0], pos: [3.8, 2.8, -0.2] },
      kitchen: { target: [4.5, 0.7, -2.8], pos: [2.0, 3.2, -1.0] },
      master: { target: [-3.0, 0.6, -2.2], pos: [-0.5, 3.0, -0.2] },
      child: { target: [-3.0, 0.6, 2.2], pos: [-0.5, 3.0, 0.5] },
      play: { target: [11.0, 0.2, 4.0], pos: [16.0, 4.5, 8.5] },
      front: { target: [3.0, 0.8, 4.5], pos: [3.0, 2.4, 8.5] }
    };

    // Interpolation Animation Parameters
    const ANIMATION_WINDOW_MS = 1000;
    let transitionState = null;

    const lerpVector3 = (vStart, vEnd, alpha) => {
      return new THREE.Vector3().lerpVectors(vStart, vEnd, alpha);
    };

    const triggerCameraTransition = (key) => {
      const node = navigationalNodes[key];
      if (!node) return;

      transitionState = {
        epoch: performance.now(),
        initialPos: camera.position.clone(),
        targetPos: new THREE.Vector3(...node.pos),
        initialLookAt: controls.target.clone(),
        targetLookAt: new THREE.Vector3(...node.target)
      };
    };

    // UI Interactive Event Distribution Loop
    const buttons = document.querySelectorAll("#ui button");
    buttons.forEach(btn => {
      btn.addEventListener("click", (e) => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        triggerCameraTransition(btn.dataset.view);
      });
    });

    // Active Engine Render Cycle
    const runAnimationLoop = () => {
      requestAnimationFrame(runAnimationLoop);

      if (transitionState) {
        const delta = performance.now() - transitionState.epoch;
        const normalizedProgress = Math.min(delta / ANIMATION_WINDOW_MS, 1.0);
        
        // Custom Smooth Step Transition Transform Curve
        const smoothFactor = normalizedProgress * normalizedProgress * (3 - 2 * normalizedProgress);

        camera.position.copy(lerpVector3(transitionState.initialPos, transitionState.targetPos, smoothFactor));
        controls.target.copy(lerpVector3(transitionState.initialLookAt, transitionState.targetLookAt, smoothFactor));

        if (normalizedProgress >= 1.0) {
          transitionState = null;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    };

    runAnimationLoop();

    // Responsive Canvas Resizing Handler
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
